[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "pyetm"
version = "2.0.1"
description = "Python-ETM Connector"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Nora Schinkel", email = "nora.schinkel@quintel.com" },
  { name = "Louis Parkes-Talbot", email = "louis.parkestalbot@quintel.com" }
]
keywords = ["energy", "transition", "modelling", "api", "ETM"]
requires-python = ">=3.12,<4.0"

dependencies = [
  # Pydantic ecosystem - pinned to v2 for API stability
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.14.2,<3.0.0",

  # Data handling - pandas 3.x tested and compatible
  "pandas>=2.0.0,<4.0.0",
  "openpyxl>=3.0.0",
  "xlsxwriter>=3.0.0",

  # HTTP clients
  "requests>=2.31.0,<3.0.0",
  "aiohttp>=3.14.1,<4.0.0",

  # Configuration and utilities
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.0",

  # CLI framework
  "click>=8.0.0",
]

[project.scripts]
pyetm = "pyetm.__main__:main"

[project.urls]
"Repository"    = "https://github.com/quintel/pyetm"
"Documentation" = "https://quintel.github.io/pyetm/"
"Issue tracker" = "https://github.com/quintel/pyetm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
packages = [
  { include = "pyetm", from = "src" }
]
include = [
  "LICENSE",
  "src/pyetm/config/*.yml",
  "src/pyetm/config/*.yaml",
  "src/pyetm/templates/*",
]


[tool.poetry.group.dev.dependencies]
# Testing
pytest = ">=8.0.0"
pytest-cov = ">=4.0.0"
requests-mock = ">=1.12.0"

# Code quality
pylint = ">=3.0.0"
pydeps = ">=3.0.0"
pre-commit = ">=3.5.0"

# Type checking
mypy = ">=1.7.0"
pandas-stubs = ">=2.0.0"
types-requests = ">=2.31.0"
types-pyyaml = ">=6.0.0"

# Documentation
mkdocs = ">=1.5.0,<2.0.0"
mkdocs-material = ">=9.5.0"
mkdocstrings = {extras = ["python"], version = ">=0.24.0"}
mkdocs-gen-files = ">=0.5.0"
mkdocs-literate-nav = ">=0.6.0"
mkdocs-section-index = ">=0.3.0"

# Jupyter/Notebooks
ipykernel = ">=6.29.0"
notebook = ">=7.0.0"



[tool.pytest.ini_options]
addopts = "--cov=pyetm --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
# Target Python 3.12+
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Enable comprehensive linting
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle (docstring rules)
  "RUF",    # Ruff-specific rules
  "ANN",    # flake8-annotations
]

ignore = [
  "D203",   # one-blank-line-before-class (conflicts with D211)
  "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D100",   # missing module docstring
  "D103",   # missing function docstring in tests
  "ANN001", # missing type annotations in tests
  "ANN201", # missing return type in tests
]
"**/__init__.py" = [
  "D104",   # missing module docstring in __init__
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Disabled to allow flexible mypy invocations (src only, or src+tests)
warn_unused_configs = false
show_error_codes = true

# Allow gradual adoption for tests
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pylint.main]
fail-under = 8.0
