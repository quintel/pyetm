# Dependabot configuration — pyetm
#
# Policy:
#   - Security bumps   -> grouped into one PR, auto-merged on green CI.
#   - Minor / patch    -> one grouped weekly PR, also auto-merged on green CI
#                         (CI is the "nothing breaks" gate for semver-compatible bumps).
#   - Majors           -> one grouped "major-updates" PR per ecosystem: a standing
#                         list of what we're behind on. It won't go green (breaking
#                         changes bundled) and isn't merged as a unit — it's a
#                         dashboard; tackle a given major on its own when ready.
#
# The security and minor/patch groups auto-merge on green CI; majors wait for a
# human. The auto-merge logic lives in .github/workflows/dependabot-auto-merge.yml.

version: 2

updates:
  # ---- Python (Poetry) ----
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Security fixes -> one PR, auto-merged on green.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Minor + patch updates -> one grouped PR per week, auto-merged on green CI.
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Every major -> one grouped standing PR (a "what we're behind on" list). It
      # won't go green and isn't merged as a unit; tackle each major on its own.
      major-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
